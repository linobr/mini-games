<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 542" role="img" aria-labelledby="title desc"><title id="title">Multiplayer-Architektur</title><desc id="desc">PeerJS Cloud unterstützt den Verbindungsaufbau. Turbo Bump und Color Clash nutzen anschliessend einen Host-Browser, der Eingaben prüft und Spielzustand an Gäste über WebRTC verteilt.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#121c33"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#56e4cf"/><stop offset="1" stop-color="#79a7ff"/></linearGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#263550" stroke-width="1" opacity=".35"/></pattern>
</defs><rect x="0" y="0" width="1200" height="542" rx="24" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6984ad"/></marker></defs><text x="48" y="54" font-size="14" fill="#56e4cf" font-weight="600">ONLINE-ARCHITEKTUR</text><text x="48" y="100" font-size="34" fill="#f1f6ff" font-weight="700">Der Host führt. Gäste senden Eingaben.</text><text x="48" y="132" font-size="18" fill="#aebed8">Host-Modell von Turbo Bump und Color Clash Flip.</text><rect x="390" y="159" width="420" height="77" rx="14" fill="#1a2642" stroke="#526ca4"/><text x="600" y="190" font-size="22" fill="#f1f6ff" font-weight="600" text-anchor="middle">PeerJS Cloud</text><text x="600" y="216" font-size="16" fill="#aebed8" text-anchor="middle">Externe Signalisierung</text><path d="M420 236 280 302M780 236 920 302" stroke="#6984ad" stroke-width="2" stroke-dasharray="7 7" fill="none" marker-end="url(#arrow)"/><rect x="60" y="306" width="440" height="128" rx="14" fill="#152b38" stroke="#3b726e"/><text x="86" y="338" font-size="14" fill="#56e4cf" font-weight="600">HOST-BROWSER</text><text x="86" y="371" font-size="24" fill="#f1f6ff" font-weight="600">Regeln und Zustand</text><text x="86" y="400" font-size="16" fill="#aebed8">Prüft Aktionen; verwaltet Physik oder Karten</text><rect x="700" y="306" width="440" height="128" rx="14" fill="#1a2642" stroke="#526ca4"/><text x="726" y="338" font-size="14" fill="#8dafff" font-weight="600">GAST-BROWSER</text><text x="726" y="371" font-size="24" fill="#f1f6ff" font-weight="600">Eingaben und Ansicht</text><text x="726" y="400" font-size="16" fill="#aebed8">Erhält den für ihn bestimmten Spielzustand</text><path d="M700 336H507M500 407H693" stroke="#56e4cf" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="600" y="325" font-size="14" fill="#aebed8" text-anchor="middle">Aktionen</text><text x="600" y="430" font-size="14" fill="#aebed8" text-anchor="middle">Zustand</text><text x="600" y="374" font-size="18" fill="#73e6d1" font-weight="600" text-anchor="middle">WebRTC</text><text x="60" y="484" font-size="16" fill="#c0cee4">Color Clash: Gäste erhalten nur eigene Handkarten. Bots werden vom Host gesteuert.</text><text x="60" y="516" font-size="15" fill="#8296b8">Kein eigener Spielserver. Host-Ausfall beendet den Raum; restriktive Netze können Verbindungen verhindern.</text></g></svg>
