<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 632" role="img" aria-labelledby="title desc"><title id="title">Katalogkategorien und Spielerplätze</title><desc id="desc">Zehn Katalogeinträge: vier Arcade, je zwei Abenteuer und Strategie, je ein Aufbau und Lernen. Multiplayer-Obergrenzen: zwei für Tic-Tac-Toe, je vier für Turbo Bump und Color Clash Flip.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#121c33"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#56e4cf"/><stop offset="1" stop-color="#79a7ff"/></linearGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#263550" stroke-width="1" opacity=".35"/></pattern>
</defs><rect x="0" y="0" width="1200" height="632" rx="24" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="55" font-size="14" fill="#56e4cf" font-weight="600">PRODUKTKATALOG / QUELLCODE-STAND</text><text x="48" y="102" font-size="34" fill="#f1f6ff" font-weight="700">Was drin ist. Wie viele mitspielen.</text><text x="48" y="135" font-size="18" fill="#aebed8">Katalogverteilung und Obergrenzen der drei Mehrspielerangebote.</text><rect x="32" y="168" width="556" height="390" rx="14" fill="#152139" stroke="#2a3b58"/><rect x="612" y="168" width="556" height="390" rx="14" fill="#152139" stroke="#2a3b58"/><text x="56" y="205" font-size="14" fill="#9fb0cd">EINTRÄGE NACH KATEGORIE</text><text x="56" y="249" font-size="36" fill="#56e4cf" font-weight="700">10 Einträge</text><text x="56" y="290" font-size="17" fill="#f1f6ff">Arcade</text><text x="560" y="290" font-size="17" fill="#f1f6ff" font-weight="600" text-anchor="end">4</text><rect x="202" y="273" width="296" height="20" rx="5" fill="#0d172a"/><rect x="202" y="273" width="296" height="20" rx="5" fill="#56e4cf"/><text x="56" y="336" font-size="17" fill="#f1f6ff">Abenteuer</text><text x="560" y="336" font-size="17" fill="#f1f6ff" font-weight="600" text-anchor="end">2</text><rect x="202" y="319" width="296" height="20" rx="5" fill="#0d172a"/><rect x="202" y="319" width="148" height="20" rx="5" fill="#617fa5"/><text x="56" y="382" font-size="17" fill="#f1f6ff">Strategie</text><text x="560" y="382" font-size="17" fill="#f1f6ff" font-weight="600" text-anchor="end">2</text><rect x="202" y="365" width="296" height="20" rx="5" fill="#0d172a"/><rect x="202" y="365" width="148" height="20" rx="5" fill="#617fa5"/><text x="56" y="428" font-size="17" fill="#f1f6ff">Aufbau</text><text x="560" y="428" font-size="17" fill="#f1f6ff" font-weight="600" text-anchor="end">1</text><rect x="202" y="411" width="296" height="20" rx="5" fill="#0d172a"/><rect x="202" y="411" width="74" height="20" rx="5" fill="#617fa5"/><text x="56" y="474" font-size="17" fill="#f1f6ff">Lernen</text><text x="560" y="474" font-size="17" fill="#f1f6ff" font-weight="600" text-anchor="end">1</text><rect x="202" y="457" width="296" height="20" rx="5" fill="#0d172a"/><rect x="202" y="457" width="74" height="20" rx="5" fill="#617fa5"/><text x="636" y="205" font-size="14" fill="#9fb0cd">MAXIMALE TEILNEHMERPLÄTZE</text><text x="636" y="249" font-size="36" fill="#8dafff" font-weight="700">Bis zu 4</text><text x="636" y="300" font-size="17" fill="#f1f6ff">Tic-Tac-Toe</text><text x="1140" y="300" font-size="17" fill="#f1f6ff" font-weight="600" text-anchor="end">2</text><rect x="636" y="312" width="504" height="24" rx="6" fill="#0d172a"/><rect x="636" y="312" width="252" height="24" rx="6" fill="#61789d"/><text x="636" y="378" font-size="17" fill="#f1f6ff">Turbo Bump</text><text x="1140" y="378" font-size="17" fill="#f1f6ff" font-weight="600" text-anchor="end">4</text><rect x="636" y="390" width="504" height="24" rx="6" fill="#0d172a"/><rect x="636" y="390" width="504" height="24" rx="6" fill="#8dafff"/><text x="636" y="456" font-size="17" fill="#f1f6ff">Color Clash Flip</text><text x="1140" y="456" font-size="17" fill="#f1f6ff" font-weight="600" text-anchor="end">4</text><rect x="636" y="468" width="504" height="24" rx="6" fill="#0d172a"/><rect x="636" y="468" width="504" height="24" rx="6" fill="#8dafff"/><text x="636" y="533" font-size="14" fill="#aebed8">Color Clash: Plätze können auch Bots enthalten.</text><path d="M48 582H1152" stroke="#2c3d59"/><text x="48" y="610" font-size="16" fill="#c0cee4">Katalog: inkl. KI-Ableger und Atom-Labor · Spielplätze: Obergrenzen, keine Nutzerstatistik</text></g></svg>
