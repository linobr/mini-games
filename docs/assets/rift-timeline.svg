<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 496" role="img" aria-labelledby="title desc"><title id="title">RIFT-RELAY-Spielablauf</title><desc id="desc">Ein erfolgreicher RIFT-RELAY-Run dauert 180 Sekunden. Bei 60 und 120 Sekunden beginnt eine neue Phase mit einem Kern; bei 180 Sekunden endet ein überlebter Run.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#121c33"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#56e4cf"/><stop offset="1" stop-color="#79a7ff"/></linearGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#263550" stroke-width="1" opacity=".35"/></pattern>
</defs><rect x="0" y="0" width="1200" height="496" rx="24" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="54" font-size="14" fill="#56e4cf" font-weight="600">RIFT//RELAY / RUN-TIMELINE</text><text x="48" y="101" font-size="34" fill="#f1f6ff" font-weight="700">Drei Minuten. Zwei Kernereignisse.</text><text x="48" y="134" font-size="18" fill="#aebed8">Ablauf eines überlebten Runs gemäss Engine. Eine Niederlage kann früher beenden.</text><rect x="60" y="190" width="1080" height="20" rx="10" fill="#0d172a"/><rect x="60" y="190" width="360" height="20" rx="10" fill="#56e4cf"/><rect x="420" y="190" width="360" height="20" rx="0" fill="#79a7ff"/><rect x="780" y="190" width="360" height="20" rx="10" fill="#a995ed"/><circle cx="60" cy="200" r="8" fill="#f1f6ff" stroke="#101827" stroke-width="3"/><text x="60" y="173" font-size="18" fill="#f1f6ff" font-weight="600">0 s</text><circle cx="420" cy="200" r="8" fill="#f1f6ff" stroke="#101827" stroke-width="3"/><text x="420" y="173" font-size="18" fill="#f1f6ff" font-weight="600" text-anchor="middle">60 s</text><circle cx="780" cy="200" r="8" fill="#f1f6ff" stroke="#101827" stroke-width="3"/><text x="780" y="173" font-size="18" fill="#f1f6ff" font-weight="600" text-anchor="middle">120 s</text><circle cx="1140" cy="200" r="8" fill="#f1f6ff" stroke="#101827" stroke-width="3"/><text x="1140" y="173" font-size="18" fill="#f1f6ff" font-weight="600" text-anchor="end">180 s</text><rect x="60" y="247" width="344" height="141" rx="14" fill="#152139" stroke="#2a3b58"/><text x="82" y="278" font-size="13" fill="#9fb0cd" font-weight="600">START</text><text x="82" y="313" font-size="20" fill="#f1f6ff" font-weight="600">Bewegen, Dash, Gegenangriff</text><text x="82" y="345" font-size="15" fill="#aebed8">Kugeln umwandeln und Kombo halten.</text><rect x="428" y="247" width="344" height="141" rx="14" fill="#152139" stroke="#2a3b58"/><text x="450" y="278" font-size="13" fill="#9fb0cd" font-weight="600">KERN 1 / 60 s</text><text x="450" y="313" font-size="20" fill="#f1f6ff" font-weight="600">Phasenwechsel und Kern</text><text x="450" y="345" font-size="15" fill="#aebed8">Ein Kern erscheint; Übergang räumt auf.</text><rect x="796" y="247" width="344" height="141" rx="14" fill="#152139" stroke="#2a3b58"/><text x="818" y="278" font-size="13" fill="#9fb0cd" font-weight="600">KERN 2 / 120 s</text><text x="818" y="313" font-size="20" fill="#f1f6ff" font-weight="600">Letzte Phase bis 180 s</text><text x="818" y="345" font-size="15" fill="#aebed8">Bei 180 s endet ein überlebter Run.</text><text x="60" y="435" font-size="16" fill="#c0cee4">3 Hüllenpunkte zu Beginn · lokale Rekorde und Erfolge · kein Online-Leaderboard</text><text x="60" y="470" font-size="14" fill="#8296b8">Quelle: public/rift-relay/src/engine.js · Zeitachse in Spielsekunden, keine FPS-Messung</text></g></svg>
