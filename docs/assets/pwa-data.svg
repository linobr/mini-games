<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 574" role="img" aria-labelledby="title desc"><title id="title">PWA und lokale Daten</title><desc id="desc">Lokales Profil und Spielstände liegen getrennt vom Cache der App-Dateien. Ein neuer Service Worker wartet bis alte Tabs geschlossen sind. Online-Multiplayer benötigt weiterhin Netzwerk.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#121c33"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#56e4cf"/><stop offset="1" stop-color="#79a7ff"/></linearGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#263550" stroke-width="1" opacity=".35"/></pattern>
</defs><rect x="0" y="0" width="1200" height="574" rx="24" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6984ad"/></marker></defs><text x="48" y="54" font-size="14" fill="#56e4cf" font-weight="600">BROWSERDATEN UND OFFLINE-APP</text><text x="48" y="100" font-size="34" fill="#f1f6ff" font-weight="700">App-Dateien und Spielstände bleiben getrennt.</text><rect x="380" y="138" width="440" height="73" rx="14" fill="#1d3349" stroke="#58cfbf"/><text x="600" y="168" font-size="22" fill="#f1f6ff" font-weight="600" text-anchor="middle">Mini Games im Browser</text><text x="600" y="193" font-size="16" fill="#aebed8" text-anchor="middle">PWA im Produktionsbuild</text><path d="M600 211V239H310V267M600 239H890V267M310 239V267" stroke="#6984ad" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="60" y="272" width="500" height="105" rx="14" fill="#152b38" stroke="#3b726e"/><text x="86" y="305" font-size="14" fill="#56e4cf" font-weight="600">LOCALSTORAGE</text><text x="86" y="337" font-size="23" fill="#f1f6ff" font-weight="600">Profil und Spielstände</text><text x="86" y="363" font-size="16" fill="#aebed8">Spiel- und Hub-Schlüssel im eigenen Browser</text><rect x="640" y="272" width="500" height="105" rx="14" fill="#1a2642" stroke="#526ca4"/><text x="666" y="305" font-size="14" fill="#8dafff" font-weight="600">CACHESTORAGE</text><text x="666" y="337" font-size="23" fill="#f1f6ff" font-weight="600">Versionierte App-Dateien</text><text x="666" y="363" font-size="16" fill="#aebed8">Vollständiger Build-Cache für lokale Assets</text><path d="M310 377V410M890 377V410" stroke="#6984ad" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="60" y="415" width="500" height="88" rx="14" fill="#10202f" stroke="#2a3b58"/><text x="86" y="447" font-size="21" fill="#f1f6ff" font-weight="600">Kein Cloud-Sync</text><text x="86" y="476" font-size="16" fill="#aebed8">Berggarten: JSON-Export für eigene Sicherungen</text><rect x="640" y="415" width="500" height="88" rx="14" fill="#10202f" stroke="#2a3b58"/><text x="666" y="447" font-size="21" fill="#f1f6ff" font-weight="600">Updates nach Schliessen alter Tabs</text><text x="666" y="476" font-size="16" fill="#aebed8">Der Worker löscht eigene alte Build-Caches</text><text x="60" y="549" font-size="16" fill="#9fb0cd">Offline erst nach erfolgreichem vollständigem Caching. Online-Multiplayer benötigt weiterhin Netzwerk.</text></g></svg>
