<text x="58" y="224" font-size="61" fill="url(#accent)" font-weight="700">Viele Spielwelten.</text>
<text x="61" y="270" font-size="21" fill="#aebed8">Abenteuer. Arcade. Strategie. Lernen.</text>
<text x="61" y="302" font-size="21" fill="#aebed8">Allein, am selben Gerät oder verbunden.</text>
