<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Mini Games – ein Hub, viele Spielwelten</title><desc id="desc">NEXUS verbindet den Produktionskatalog mit zehn Einträgen in fünf Kategorien. Solo, lokal am selben Gerät und online über WebRTC.</desc><defs>
