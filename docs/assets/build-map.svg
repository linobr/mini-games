<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 626" role="img" aria-labelledby="title desc"><title id="title">Build- und Deployment-Übersicht</title><desc id="desc">Vite hat fünf HTML-Einstiege und übernimmt statische Public-Dateien. npm run build baut, ergänzt die KI-Live-Karte und erzeugt den PWA-Cache. GitHub Actions testet und veröffentlicht dist.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#121c33"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#56e4cf"/><stop offset="1" stop-color="#79a7ff"/></linearGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#263550" stroke-width="1" opacity=".35"/></pattern>
</defs><rect x="0" y="0" width="1200" height="626" rx="24" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#6984ad"/></marker></defs><text x="48" y="54" font-size="14" fill="#56e4cf" font-weight="600">QUELLCODE BIS VERÖFFENTLICHUNG</text><text x="48" y="100" font-size="34" fill="#f1f6ff" font-weight="700">Ein Build verbindet mehrere Spieleinstiege.</text><rect x="60" y="144" width="500" height="108" rx="14" fill="#152b38" stroke="#3b726e"/><text x="86" y="175" font-size="14" fill="#56e4cf" font-weight="600">5 VITE-EINSTIEGE</text><text x="86" y="208" font-size="21" fill="#f1f6ff" font-weight="600">Hub · Berggarten · Atom-Labor</text><text x="86" y="235" font-size="17" fill="#aebed8">Mooslicht · KI-Mooslicht</text><rect x="640" y="144" width="500" height="108" rx="14" fill="#1a2642" stroke="#526ca4"/><text x="666" y="175" font-size="14" fill="#8dafff" font-weight="600">PUBLIC-DATEIEN</text><text x="666" y="208" font-size="21" fill="#f1f6ff" font-weight="600">Meteor · Neon · RIFT//RELAY</text><text x="666" y="235" font-size="17" fill="#aebed8">Cover, Icons und weitere statische Assets</text><path d="M310 252V278H600V303M890 252V278H600" stroke="#6984ad" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="60" y="309" width="1080" height="124" rx="14" fill="#152139" stroke="#2a3b58"/><text x="86" y="341" font-size="14" fill="#9fb0cd" font-weight="600">NPM RUN BUILD</text><text x="86" y="376" font-size="21" fill="#f1f6ff" font-weight="600">Vite Build</text><text x="86" y="405" font-size="16" fill="#aebed8">MPA und statische Dateien</text><text x="465" y="376" font-size="21" fill="#f1f6ff" font-weight="600">Live-Karte injizieren</text><text x="465" y="405" font-size="16" fill="#aebed8">KI-Ableger im Hub ergänzen</text><text x="830" y="376" font-size="21" fill="#f1f6ff" font-weight="600">PWA erzeugen</text><text x="830" y="405" font-size="16" fill="#aebed8">Build-Version und Precache</text><path d="M600 433V466" stroke="#6984ad" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="60" y="471" width="1080" height="87" rx="14" fill="#10202f" stroke="#2a3b58"/><text x="86" y="505" font-size="22" fill="#f1f6ff" font-weight="600">GitHub Pages veröffentlicht dist/</text><text x="86" y="535" font-size="17" fill="#aebed8">Actions prüft Regeltests, Browserabläufe und Spieleinstiege vor dem Deployment.</text><text x="60" y="602" font-size="15" fill="#8296b8">Lokal: Dev-Katalog kann 9 Einträge zeigen. Die Live-Karte wird im Produktionsbuild ergänzt.</text></g></svg>
