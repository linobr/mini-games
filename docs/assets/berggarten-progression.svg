</defs><rect x="0" y="0" width="1200" height="638" rx="24" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="54" font-size="14" fill="#56e4cf" font-weight="600">BERGGARTEN / REGIONEN-FREISCHALTUNG</text><text x="48" y="101" font-size="34" fill="#f1f6ff" font-weight="700">Fünf Regionen. Ein wachsendes Tal.</text><text x="48" y="134" font-size="18" fill="#aebed8">Preise für die jeweils nächste Region – keine kumulierten Kosten.</text><rect x="32" y="168" width="1136" height="337" rx="14" fill="#152139" stroke="#2a3b58"/><text x="60" y="204" font-size="14" fill="#9fb0cd">REGION</text><text x="1118" y="204" font-size="14" fill="#9fb0cd" text-anchor="end">MÜNZEN</text><text x="60" y="252" font-size="17" fill="#f1f6ff">Sonnenwiese</text><rect x="405" y="234" width="620" height="24" rx="6" fill="#0d172a"/><text x="1120" y="252" font-size="17" fill="#f1f6ff" font-weight="600" text-anchor="end">Startgebiet</text><text x="60" y="304" font-size="17" fill="#f1f6ff">Steinbruch</text><rect x="405" y="286" width="620" height="24" rx="6" fill="#0d172a"/><rect x="405" y="286" width="62" height="24" rx="6" fill="#56e4cf"/><text x="1120" y="304" font-size="17" fill="#f1f6ff" font-weight="600" text-anchor="end">180</text><text x="60" y="356" font-size="17" fill="#f1f6ff">Kristallhöhen</text><rect x="405" y="338" width="620" height="24" rx="6" fill="#0d172a"/><rect x="405" y="338" width="223.88888888888889" height="24" rx="6" fill="#56e4cf"/><text x="1120" y="356" font-size="17" fill="#f1f6ff" font-weight="600" text-anchor="end">650</text><text x="60" y="408" font-size="17" fill="#f1f6ff">Waldtal</text><rect x="405" y="390" width="620" height="24" rx="6" fill="#0d172a"/><rect x="405" y="390" width="378.8888888888889" height="24" rx="6" fill="#56e4cf"/><text x="1120" y="408" font-size="17" fill="#f1f6ff" font-weight="600" text-anchor="end">1'100</text><text x="60" y="460" font-size="17" fill="#f1f6ff">Schneegipfel &amp; Alpendorf</text><rect x="405" y="442" width="620" height="24" rx="6" fill="#0d172a"/><rect x="405" y="442" width="620" height="24" rx="6" fill="#8dafff"/><text x="1120" y="460" font-size="17" fill="#f1f6ff" font-weight="600" text-anchor="end">1'800</text><text x="405" y="492" font-size="13" fill="#8296b8">0</text><text x="715" y="492" font-size="13" fill="#8296b8" text-anchor="middle">900</text><text x="1025" y="492" font-size="13" fill="#8296b8" text-anchor="end">1’800</text><text x="60" y="550" font-size="26" fill="#8dafff" font-weight="600">4 Betriebe</text><text x="60" y="579" font-size="15" fill="#aebed8">Sägewerk bis Alpenwerkstatt</text><text x="445" y="550" font-size="26" fill="#8dafff" font-weight="600">3 Ausbaustufen</text><text x="445" y="579" font-size="15" fill="#aebed8">je Produktionsgebäude</text><text x="830" y="550" font-size="26" fill="#8dafff" font-weight="600">300 Sekunden</text><text x="830" y="579" font-size="15" fill="#aebed8">maximaler Offline-Fortschritt</text><text x="60" y="616" font-size="13" fill="#8296b8">Quelle: src/berggarten/engine.js und evolution.js · Spielregeln, keine Preisempfehlung oder Echtgeldausgaben</text></g></svg>
