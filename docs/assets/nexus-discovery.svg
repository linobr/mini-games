<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 644" role="img" aria-labelledby="title desc"><title id="title">Entdecker-XP als Regelkurve</title><desc id="desc">25 lokale XP pro erstmals geöffnetem Katalogeintrag. Bei zehn Einträgen ergeben sich maximal 250 XP. Level 2 ab vier, Level 3 ab acht verschiedenen Einträgen. Keine echte Nutzungsstatistik.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#121c33"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#56e4cf"/><stop offset="1" stop-color="#79a7ff"/></linearGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#263550" stroke-width="1" opacity=".35"/></pattern>
</defs><rect x="0" y="0" width="1200" height="644" rx="24" fill="url(#bg)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="54" font-size="14" fill="#56e4cf" font-weight="600">NEXUS / LOKALE ENTDECKER-XP</text><text x="48" y="100" font-size="34" fill="#f1f6ff" font-weight="700">Erstmals öffnen bringt 25 XP.</text><text x="48" y="134" font-size="18" fill="#aebed8">Regelkurve: Öffnungen sind keine Siege, Spielminuten oder abgeschlossenen Runs.</text><rect x="32" y="166" width="1136" height="345" rx="14" fill="#152139" stroke="#2a3b58"/><path d="M130 447H1090" stroke="#2a3b58"/><text x="110" y="452" font-size="14" fill="#9fb0cd" text-anchor="end">0</text><path d="M130 400.8H1090" stroke="#2a3b58"/><text x="110" y="405.8" font-size="14" fill="#9fb0cd" text-anchor="end">50</text><path d="M130 354.6H1090" stroke="#2a3b58"/><text x="110" y="359.6" font-size="14" fill="#9fb0cd" text-anchor="end">100</text><path d="M130 308.4H1090" stroke="#2a3b58"/><text x="110" y="313.4" font-size="14" fill="#9fb0cd" text-anchor="end">150</text><path d="M130 262.2H1090" stroke="#2a3b58"/><text x="110" y="267.2" font-size="14" fill="#9fb0cd" text-anchor="end">200</text><path d="M130 216H1090" stroke="#2a3b58"/><text x="110" y="221" font-size="14" fill="#9fb0cd" text-anchor="end">250</text><text x="130" y="475" font-size="14" fill="#9fb0cd" text-anchor="middle">0</text><text x="226" y="475" font-size="14" fill="#9fb0cd" text-anchor="middle">1</text><text x="322" y="475" font-size="14" fill="#9fb0cd" text-anchor="middle">2</text><text x="418" y="475" font-size="14" fill="#9fb0cd" text-anchor="middle">3</text><text x="514" y="475" font-size="14" fill="#9fb0cd" text-anchor="middle">4</text><text x="610" y="475" font-size="14" fill="#9fb0cd" text-anchor="middle">5</text><text x="706" y="475" font-size="14" fill="#9fb0cd" text-anchor="middle">6</text><text x="802" y="475" font-size="14" fill="#9fb0cd" text-anchor="middle">7</text><text x="898" y="475" font-size="14" fill="#9fb0cd" text-anchor="middle">8</text><text x="994" y="475" font-size="14" fill="#9fb0cd" text-anchor="middle">9</text><text x="1090" y="475" font-size="14" fill="#9fb0cd" text-anchor="middle">10</text><polyline points="130,447 226,423.9 322,400.8 418,377.7 514,354.6 610,331.5 706,308.4 802,285.3 898,262.2 994,239.1 1090,216" fill="none" stroke="#56e4cf" stroke-width="4"/><circle cx="130" cy="447" r="6" fill="#8dafff" stroke="#101827" stroke-width="2"/><circle cx="226" cy="423.9" r="6" fill="#8dafff" stroke="#101827" stroke-width="2"/><circle cx="514" cy="354.6" r="6" fill="#8dafff" stroke="#101827" stroke-width="2"/><circle cx="898" cy="262.2" r="6" fill="#8dafff" stroke="#101827" stroke-width="2"/><circle cx="1090" cy="216" r="6" fill="#8dafff" stroke="#101827" stroke-width="2"/><text x="128" y="195" font-size="14" fill="#9fb0cd">XP</text><text x="1090" y="501" font-size="13" fill="#8296b8" text-anchor="end">Verschiedene geöffnete Katalogeinträge</text><text x="60" y="552" font-size="21" fill="#f1f6ff" font-weight="600">0–3 Einträge</text><text x="60" y="581" font-size="16" fill="#8dafff">Level 1</text><text x="430" y="552" font-size="21" fill="#f1f6ff" font-weight="600">4–7 Einträge</text><text x="430" y="581" font-size="16" fill="#8dafff">Level 2</text><text x="800" y="552" font-size="21" fill="#f1f6ff" font-weight="600">8–10 Einträge</text><text x="800" y="581" font-size="16" fill="#8dafff">Level 3</text><text x="60" y="620" font-size="14" fill="#8296b8">Maximal 250 Entdecker-XP im aktuellen Produktionskatalog. Wiederholte Starts bringen keine zusätzlichen XP.</text></g></svg>
